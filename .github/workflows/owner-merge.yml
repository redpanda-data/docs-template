name: Owner Merge

# Docs team members merge their own content changes without a second
# approval (DEVPROD-5038). Same design as cupboard's owner-merge.yml
# (DEVPROD-4759).
#
# The default-branch ruleset requires a code-owner review and dismisses
# stale reviews. This workflow supplies that review as @rpdocsbot, the
# only member of @redpanda-data/docsbot, when every path the PR changes
# is on a CODEOWNERS line that lists @redpanda-data/docsbot and the
# author is an active member of another team on that line. The author
# then merges normally. Any other PR (an outsider's PR, or a change to
# a path the bot is not listed on, such as build files or .github/)
# gets no approval from the bot, and the owners review as usual.
#
# Security posture:
# - pull_request_target runs THIS file's default-branch version, so a PR
#   cannot change the workflow and run the changed copy with secrets.
#   Only the default branch is checked out, never the PR's base.ref,
#   which a collaborator can point at any branch. No PR code executes.
# - CODEOWNERS is read from the default branch, so a PR cannot grant
#   itself ownership by editing CODEOWNERS.
# - The bot is not a code owner of .github/ or CODEOWNERS, so its
#   approval cannot unlock workflow or repo-config changes even if this
#   workflow misfires.
# - The ruleset dismisses stale reviews, so every push needs a new
#   decision from this workflow.
# - The token comes from AWS through a role that trusts only the
#   owner-merge environment, which accepts main only. Do not add
#   workflow_dispatch or other triggers: the environment limits the ref,
#   not the event.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: owner-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-merge:
    # Same-repo, non-draft PRs only, and never the bot's own PRs. Fork
    # PRs get no approval and get the normal owner review. An `edited`
    # event runs only when the base branch changed.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'rpdocsbot' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    # Limited to main; the only environment the token's AWS role trusts.
    # Only this workflow may use it.
    environment: owner-merge

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}docs-owner-merge

      # rpdocsbot PAT for the docs repos (pull requests read/write, org
      # members read), rotated every 90 days.
      - uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,sdlc/prod/github/docs_owner_merge_token
          parse-json-secrets: true

      - name: Approve when the author owns every changed path
        env:
          GH_TOKEN: ${{ env.DOCS_OWNER_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          ORG = "redpanda-data"
          BOT_TEAM = "docsbot"
          BOT_USER = "rpdocsbot"
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          author = os.environ["AUTHOR"]
          head_sha = os.environ["HEAD_SHA"]

          def gh(*args):
              res = subprocess.run(["gh", *args], capture_output=True, text=True)
              return res.returncode, res.stdout

          def gh_json(path, paginate=False):
              args = ["api", path]
              if paginate:
                  args += ["--paginate", "--slurp"]
              rc, out = gh(*args)
              if rc != 0:
                  return None
              data = json.loads(out)
              if paginate:  # --slurp wraps pages in an outer array
                  data = [x for page in data for x in page]
              return data

          def bail(msg):
              print(f"no owner-merge: {msg}")
              sys.exit(0)

          # Ownership rules, from the default branch's CODEOWNERS. Only a
          # bare `*` catch-all and anchored exact-file and directory-prefix
          # patterns are supported; anything else fails closed.
          rules = []
          with open(".github/CODEOWNERS") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  pattern, *owners = line.split()
                  if pattern == "*":
                      rules.append(("", owners))  # matches every path
                      continue
                  if not pattern.startswith("/") or "*" in pattern:
                      bail(f"unsupported CODEOWNERS pattern {pattern!r}")
                  rules.append((pattern[1:], owners))

          def owners_of(path):
              matched = None
              for prefix, owners in rules:  # last match wins
                  if (not prefix or path == prefix
                          or (prefix.endswith("/") and path.startswith(prefix))):
                      matched = owners
              return matched

          files = gh_json(f"repos/{repo}/pulls/{pr}/files", paginate=True)
          if files is None:
              bail("could not list changed files")
          paths = {f["filename"] for f in files}
          paths |= {f["previous_filename"] for f in files if f.get("previous_filename")}

          # Every changed path must be on a line that lists the bot team,
          # and the author must be an active member of another team on that
          # line. A path that no line owns also blocks the approval, so the
          # bot never approves a change outside the listed lines.
          membership_cache = {}

          def is_member(team_slug):
              if team_slug not in membership_cache:
                  data = gh_json(f"orgs/{ORG}/teams/{team_slug}/memberships/{author}")
                  membership_cache[team_slug] = bool(data and data.get("state") == "active")
              return membership_cache[team_slug]

          for path in sorted(paths):
              owners = owners_of(path)
              if owners is None:
                  bail(f"{path}: no CODEOWNERS line owns it")
              if f"@{ORG}/{BOT_TEAM}" not in owners:
                  bail(f"{path}: owner-merge is not enabled for {owners}")
              teams = [o.removeprefix(f"@{ORG}/") for o in owners
                       if o.startswith(f"@{ORG}/") and o != f"@{ORG}/{BOT_TEAM}"]
              if not any(is_member(t) for t in teams):
                  bail(f"{path}: @{author} is not in {teams}")

          # Idempotence: skip if the bot already approved this head.
          reviews = gh_json(f"repos/{repo}/pulls/{pr}/reviews", paginate=True) or []
          for r in reviews:
              if (r["user"]["login"] == BOT_USER and r["state"] == "APPROVED"
                      and r["commit_id"] == head_sha):
                  bail(f"already approved {head_sha[:8]}")

          body = (f"owner-merge: @{author} is a member of the owning team for "
                  "every path in this PR, so per the owner-merge policy "
                  "(DEVPROD-5038) no second review is required. Approving so "
                  "the author can merge.")
          rc, out = gh("pr", "review", pr, "--repo", repo, "--approve", "--body", body)
          if rc != 0:
              print(out)
              sys.exit(1)
          print(f"approved PR #{pr} at {head_sha[:8]} for @{author}")
